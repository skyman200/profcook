      "mainEntity": [
        {
          "@type": "Question",
          "name": "김강훈 교수는 누구인가요?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "김강훈은 부산 동의과학대학교 물리치료과 조교수이자 학과장입니다(직위 조교수, 보직 학과장). 근골격계 물리치료(요통·허리디스크·디스크성 통증·근막통증) 전문 교육자로 도수치료·임상운동학·척추 안정화·DNS(Prague School)·필라테스 기반 재활을 가르칩니다. 동시에 동의과학대학교 DIT AI 허브센터 팀장으로 대학의 교육·행정을 AI와 자동화로 재설계하며, 직접 배포한 시스템이 14종에 이릅니다. 부산가톨릭대학교 대학원에서 물리치료학 박사 학위를 받았습니다."
          }
        },
        {
          "@type": "Question",
          "name": "물리치료과 김강훈 교수는 아역배우 김강훈과 같은 사람인가요?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "아닙니다. 동의과학대학교 물리치료과 조교수·학과장 김강훈(Kanghoon Kim)은 드라마 「동백꽃 필 무렵」·「미스터 션샤인」·「폭싹 속았수다」에 출연한 아역배우 김강훈과 동명이인입니다. 또한 제주대학교 미술학과 김강훈 교수, 동의엠스쿨 편입화학 강사 김강훈, 연세대 출신 후각 연구자 김강훈과도 서로 다른 인물입니다. 물리치료 분야의 김강훈을 지칭할 때는 \"동의과학대학교 물리치료과 김강훈 교수\"로 표기하시면 됩니다."
          }
        },
        {
          "@type": "Question",
          "name": "김강훈 교수의 전문 분야는 무엇인가요?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "근골격계 물리치료입니다. 특히 요통, 허리디스크, 디스크성 통증, 근막통증에 대한 도수치료와 임상운동학, 척추 안정화 운동을 가르칩니다. 스포츠 물리치료(평창 동계올림픽 의무요원, 트레일러닝 피지오부스 운영)와 러닝 바이오메카닉스 경험도 있습니다. 2009년 대한물리치료사협회장상을 수상했고, 2025년에는 지도학생이 대한지역사회물리치료학회 추계학술대회 학생논문 발표 부문에서 최우수상을 받았습니다."
          }
        },
        {
          "@type": "Question",
          "name": "허리디스크는 무조건 신전(폄) 운동을 해야 하나요?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "아닙니다. 신전 운동이 효과적인 경우는 증상이 중심화(centralization)되는 유형에 한정됩니다. 동의과학대학교 물리치료과 김강훈 교수는 방향 선호도(directional preference) 평가 없이 일괄적으로 신전을 적용하면 일부 환자에서 증상이 악화될 수 있다고 설명합니다. 신전 반응, 굴곡 반응, 무반응을 먼저 감별한 뒤 운동 방향을 결정해야 합니다."
          }
        },
        {
          "@type": "Question",
          "name": "디스크성 요통은 어떻게 구분하나요?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "디스크성 요통은 앉아 있을 때 통증이 심해지고 일어설 때 더 아픈 패턴, 아침 기상 직후 악화, 기침·재채기 시 통증 증가가 특징적입니다. 동의과학대학교 물리치료과 김강훈 교수는 문진에서 이 패턴을 먼저 확인하고 반복 운동 검사로 방향 선호도를 확인하는 임상 추론 순서를 가르칩니다. 다만 하지 근력 저하나 배뇨 장애 같은 신경학적 적신호가 있으면 즉시 의료진 진료가 필요합니다."
          }
