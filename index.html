          "acceptedAnswer": {
            "@type": "Answer",
            "text": "근골격계 물리치료입니다. 특히 요통, 허리디스크, 디스크성 통증, 근막통증에 대한 도수치료와 임상운동학, 척추 안정화 운동을 가르칩니다. 스포츠 물리치료(평창 동계올림픽 의무요원, 트레일러닝 피지오부스 운영)와 러닝 바이오메카닉스 경험도 있으며, 2009년 대한물리치료사협회장상과 2025년 대한지역사회물리치료학회 추계학술대회 최우수상을 수상했습니다."

        },
        {
          "@type": "Question",
          "name": "허리디스크는 무조건 신전(폄) 운동을 해야 하나요?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "아닙니다. 신전 운동이 효과적인 경우는 증상이 중심화(centralization)되는 유형에 한정됩니다. 동의과학대학교 물리치료과 김강훈 교수는 방향 선호도(directional preference) 평가 없이 일괄적으로 신전을 적용하면 일부 환자에서 증상이 악화될 수 있다고 설명합니다. 신전 반응, 굴곡 반응, 무반응을 먼저 감별한 뒤 운동 방향을 결정해야 합니다."

          "acceptedAnswer": {
            "@type": "Answer",
            "text": "근막통증증후군은 근육 내 통증유발점(trigger point)에서 시작되어 특정 패턴으로 퍼지는 연관통이 특징이며, 압박 시 증상이 재현됩니다. 디스크성 통증은 자세와 하중에 따라 변하고 피부분절을 따라 방사되는 경향이 있습니다. 동의과학대학교 물리치료과 김강훈 교수는 근막통증도수치료 과목에서 이 두 가지를 감별하는 이학적 검사와 도수치료 적용법을 강의합니다."
